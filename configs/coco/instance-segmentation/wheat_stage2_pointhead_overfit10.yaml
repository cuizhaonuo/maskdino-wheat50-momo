# Stage2 debug：在固定 10 张带点训练图上过拟合点头。
# 训练集和评估集故意使用同一份数据，该配置不用于汇报泛化指标。
_BASE_: wheat_stage2_pointhead.yaml

DATASETS:
  TRAIN: ("wheat_cat2_pts_coco_overfit10",)
  TEST: ("wheat_cat2_pts_coco_overfit10",)

INPUT:
  # 固定几何变换：先确认模型能记住这 10 张原图，再单独检查增广。
  IMAGE_SIZE: 1024
  MIN_SCALE: 1.0
  MAX_SCALE: 1.0
  RANDOM_FLIP: "none"

SOLVER:
  IMS_PER_BATCH: 2
  MAX_ITER: 2000
  STEPS: (1600, 1900)
  WARMUP_ITERS: 100
  CHECKPOINT_PERIOD: 200

TEST:
  EVAL_PERIOD: 100

