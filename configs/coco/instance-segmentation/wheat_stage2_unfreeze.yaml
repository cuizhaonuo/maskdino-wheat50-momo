# ============================================================================
# Stage2 解冻组 · 真实数据集版（320 图训练 / 81 图 val）
#
# 与 wheat_stage2_unfreeze_allheads_overfit10.yaml 是同一套配方，只是把数据集
# 从 overfit10 换成真实的 wheat_cat2_pts_coco_train，并把评估加密以便读泛化曲线。
#
# 【重要】父配置的 DATASETS.TEST 就是 wheat_cat2_pts_coco_val ——
#   训练期评估**就是 val 评估**，自带一条泛化曲线，可直接看出过拟合拐点、
#   挑最好的 checkpoint。这与 overfit10 那批（TRAIN == TEST）性质完全不同。
#
# 四个 arm 只差 UNFREEZE_KEYS 一项，值走 CLI（与 08-26/08-27 那批同样处理）：
#   arm A  ["predictor.decoder"]                                      14,413,082
#   arm C  ["predictor.decoder","predictor.class_embed","predictor.mask_embed"]
#                                                                     14,610,972
#   arm B  ["sem_seg_head"]                                           28,733,212
#   arm D  ["backbone","sem_seg_head"]                                52,188,124
#
# 【2026-08-28 起默认值为 arm B】真实数据 320 图 / 81 图 val 上四个 arm 的判决
# （见 experiments-bank/experiments/exp-2026-08-28-unfreeze-full-model.md）：
#
#   arm | matched_F1@8 | 计数 MAE | segm AP
#   ----|--------------|----------|--------
#    A  |    0.5428    |   2.75   |  72.69
#    C  |    0.5534    |   2.69   |  72.54
#    B  |    0.5806    |   2.48   |  67.85   <- 最优点
#    D  |    0.5520    |   2.46   |  65.10
#
# matched_F1@8 在 B 处拐头（A < C < B > D）：解冻范围存在最优值，不是越多越好。
# 代价是 segm AP -5.5（掩码更糙），但 spike_precision 只差 1.2 个百分点、
# 实例照样检得出来 —— 掉的是掩码精度，不是实例检出。
# 【若掩码本身是交付物的一部分，改用 arm A】：点指标只低 7%，掩码几乎无损。
#
# 用法（默认即 arm B，无需覆盖）：
#   CUDA_VISIBLE_DEVICES=<g> PYTHONPATH=. python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_stage2_unfreeze.yaml \
#     MODEL.WEIGHTS <绝对路径>/output_v2/wheat_stage1_detector_v2_cosine/model_final.pth \
#     OUTPUT_DIR <绝对路径>/output_v2/<run 名>
#   换 arm 时追加覆盖：MODEL.MaskDINO.UNFREEZE_KEYS "['predictor.decoder']"
# ============================================================================
_BASE_: wheat_stage2_pointhead.yaml

MODEL:
  MaskDINO:
    # ---- 默认 arm B：解冻整个 sem_seg_head（pixel_decoder + predictor 的全部子模块），
    # backbone 保持冻结。可训练参数 28,733,212 —— 训练日志会打印，对不上立即停。
    # 四个 arm 通过 CLI 覆盖此项，其余一切相同。
    #
    # 拐点落在 sem_seg_head 与 backbone 之间是有实际意义的：前者是任务相关部分
    # （编码器 + 解码器 + 各预测头），后者是通用视觉特征。320 图足以重训前者、
    # 不足以重训后者 —— arm D 把 backbone 也解冻，只买到掩码进一步退化（segm AP 65.10）。
    #
    # 若覆盖成 arm A 的 ["predictor.decoder"]，注意 maskdino_decoder.py:168 的别名赋值
    #   self.decoder.bbox_embed = self.bbox_embed
    # 会连框头一并解冻（named_parameters 去重后幸存名为 predictor.decoder.bbox_embed.*）。
    UNFREEZE_KEYS: ["sem_seg_head"]

    # ======================= 损失权重：七项全部非零 =======================
    # 父配置 wheat_stage2_pointhead.yaml 把下面五项检测权重置 0，其正当性依据是
    # 「trunk 全部 requires_grad=False，这些损失对唯一可训练的点头梯度恒为 0」。
    # 一旦解冻，前提失效：decoder 变成只为点损失优化，没有任何东西惩罚它破坏检测
    # （08-26 实测代价是 segm AP 73.3 → 0.00、spike_recall 归零）。故此处必须恢复。
    #
    #   头（模块）                      损失项              权重
    #   ---------------------------------------------------------------
    #   predictor.class_embed           loss_ce             4.0
    #   predictor.mask_embed            loss_mask           5.0
    #   predictor.mask_embed            loss_dice           5.0
    #   predictor.decoder.bbox_embed    loss_bbox           5.0
    #   predictor.decoder.bbox_embed    loss_giou           2.0
    #   predictor.point_coord_embed     loss_point_coord    5.0
    #   predictor.point_class_embed     loss_point_cls      2.0
    # ====================================================================
    CLASS_WEIGHT: 4.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    POINT_COORD_WEIGHT: 5.0
    POINT_CLASS_WEIGHT: 2.0

    # ---- 外层匹配代价（@torch.no_grad，不参与反传）与内层点匹配代价：均保持原值。
    # 内层两项不可置 0，否则 linear_sum_assignment 退化成恒等分配、坐标头塌陷到中轴线。
    COST_CLASS_WEIGHT: 4.0
    COST_MASK_WEIGHT: 5.0
    COST_DICE_WEIGHT: 5.0
    COST_BOX_WEIGHT: 5.0
    COST_GIOU_WEIGHT: 2.0
    COST_POINT_COORD_WEIGHT: 5.0
    COST_POINT_CLASS_WEIGHT: 2.0

    # ---- 死参数：focal 路径不经过 empty_weight，写出来只为避免下次再查。
    NO_OBJECT_WEIGHT: 0.1

SOLVER:
  # 训练规模沿用父配置：320 图 / IMS_PER_BATCH 4 = 80 iter/epoch，8000 iter ≈ 100 epoch。
  # 解冻 14.4M~28.7M 参数后 100 epoch 大概率会过拟合——但训练期评估就是 val，
  # 直接读曲线取峰值即可，不必先猜 schedule。checkpoint 与评估同频，
  # 保证峰值那一档一定有权重可取。
  CHECKPOINT_PERIOD: 400

TEST:
  # 父配置为 800；加密到 400 以便看清泛化曲线的拐点（+20 次 81 图评估，约 20 min）。
  EVAL_PERIOD: 400
