# ============================================================================
# 完整集 · full/combo-ecount · 三合一 combo 里把计数部分（coral-exist）换成 K 臂方案：E 损失 + 计数读 round(E)
#   预注册：experiments-bank/ideas/full-combo-ecount.md（判定线在跑之前写死）
#   父臂：full/combo（wheat_joint_single_stage_full_combo.yaml，output_v2/exp-1009-full-combo）
#   主参照：output_v2/exp-0922-single-stage-p30；同批：full/coral-ecount（A + K 方案）
#   K 臂：mini/coral-ecount（mini 版）、full/coral-ecount（完整集 A 上的版本，代码 409378a，本分支从它开出）
#   用户 2026-10-24：「另外对于 full/combo 这里,这是三个创新点/分支合并后的模型(coral-exist, kmo-matcher,
#   group-nms-match),其中计数的 coral-exist 然后你将 K 臂改进的方案替换之.」
#
# 与父臂 combo 的配置差异【两项】：
#   MODEL.MaskDINO.POINT_ECOUNT_WEIGHT: 0.0 -> 1.0（沿用 K 臂的权重）
#     外层匹配上的 wheat_2（Ni >= 1）上，E = CoralHead 30 个 CORAL logit 的 sigmoid 之和（fp32），
#     loss_point_ecount = mean |E - min(Ni, 30)|，11 份深监督：
#       slot 层（layer-0、interm）：E 取 30 个 slot logit（与 slot 层 CORAL BCE 同一组）；
#       group 层（主输出、第 1~8 层）：E 取实例 query 上的 pred_point_coral（与 loss_point_coral 同一组）。
#     wheat（Ni = 0）不进这一项。
#   MODEL.MaskDINO.TEST.POINT_CORAL_READOUT: threshold -> expect
#     每穗计数 = clamp(round(E), 0, 30)（E 取最终层 pred_point_coral，无参数），写进 pred_spikelet_counts，
#     count_MAE_spike / count_MAE_img 读它；小穗点不变：n_k = sum_k 1[sigmoid(c_k) > 0.5]（K），
#     token 分数 > 0.35 ∧ 推理 NMS（κ 0.05）存活的候选按分数取 top-n_k，点级 P/R/F1 按实际输出的点算。
#     逐穗明细另记 ecount（E）、kcount（n_k）、out_points（输出点数）三列，不进任何指标。
#   其余（组合语义、CoralHead 结构与初始化、bias 的 ×10 学习率、CORAL BCE、focal、训练侧点 NMS 匹配、KMO 辅助损失、
#   100 query、NUM_POINTS 30、schedule）全部与 combo 相同。
#
# 用法：
#   python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_joint_single_stage_full_combo_ecount.yaml \
#     OUTPUT_DIR /public/home/zncui/pycharm_project/maskdino-wheat50/output_v2/<run-name>
# ============================================================================
_BASE_: wheat_joint_single_stage_full_combo.yaml

MODEL:
  MaskDINO:
    POINT_ECOUNT_WEIGHT: 1.0
    TEST:
      POINT_CORAL_READOUT: expect
