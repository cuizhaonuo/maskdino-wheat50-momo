# ============================================================================
# 完整集 · full/coral-ecount · CORAL 存在性头 + E 损失，计数读 round(E)，点仍按 K（K 臂的完整集版）
#   预注册：experiments-bank/ideas/full-coral-ecount.md（判定线在跑之前写死）
#   父臂：full/coral-exist（A，wheat_joint_single_stage_full_coral_exist.yaml，output_v2/exp-1009-full-coral-exist）
#   主参照：output_v2/exp-0922-single-stage-p30
#   mini 对应臂：mini/coral-ecount（exp-1023-mini-coral-ecount：计数 1.1897 过线，segm AP 与 F1@8 两条护栏未过）
#   代码移植自 mini/coral-ecount 的 47072eb（E 损失）与 709059d（读数），在本分支按完整集代码重写，没有 cherry-pick。
#
# 与父臂 A 的配置差异【两项】：
#   MODEL.MaskDINO.POINT_ECOUNT_WEIGHT: 0.0 -> 1.0（沿用 mini K 的权重）
#     外层匹配上的 wheat_2（Ni >= 1）上，E = sum_k sigmoid(l_k)（25 个 slot 的 CORAL logit，fp32）是存在性头的
#     期望计数；新损失 loss_point_ecount = mean |E - min(Ni, 25)|，与 CORAL BCE 同一组输出（主输出、9 份 aux、
#     interm）深监督，共 11 项。wheat（Ni = 0）不进这一项。
#   MODEL.MaskDINO.TEST.POINT_CORAL_READOUT: threshold -> expect
#     每穗计数 = clamp(round(E), 0, 25)（无参数），写进 pred_spikelet_counts，count_MAE_spike / count_MAE_img 读它；
#     小穗点仍输出前 K 个 slot（K = sum_k 1[sigmoid(l_k) > 0.5]，与 A 相同），点级 P/R/F1 按实际输出的点算。
#     训练期内置评估也用这个读数。逐穗明细另记 ecount（E）、kcount（K）、out_points（输出点数）三列，不进任何指标。
#   CoralHead 的结构与初始化、bias 的 ×10 学习率（train_net.py 的参数组）、CORAL BCE、前缀内层匹配全部不变。
#
# 用法：
#   python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_joint_single_stage_full_coral_ecount.yaml \
#     OUTPUT_DIR /public/home/zncui/pycharm_project/maskdino-wheat50/output_v2/<run-name>
# ============================================================================
_BASE_: wheat_joint_single_stage_full_coral_exist.yaml

MODEL:
  MaskDINO:
    POINT_ECOUNT_WEIGHT: 1.0
    TEST:
      POINT_CORAL_READOUT: expect
