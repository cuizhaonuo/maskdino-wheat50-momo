# ============================================================================
# 两阶段迁移 · Stage2：只训练小穗点头（point_coord_embed / point_class_embed）
#   数据：coco_2cat_with_points（带点小数据集，train=320 / val=81 图，点集中在 wheat_2）
#   冻结：backbone + pixel decoder + transformer decoder + cls/mask/box 头全部 requires_grad=False，
#         只有点头进优化器。（模型里没有 BN/dropout 需要额外固定：backbone 是 FrozenBN、
#         pixel decoder 是 GN、DROPOUT=0.0。）
#   匹配：点匹配代价置 0，使外层匈牙利匹配与 Stage1 完全相同（只有点损失反传到点头）。
#   评估：除 COCOEvaluator 的 mask/box AP 外，加挂 SpikeletPointEvaluator 评小穗点定位与计数。
# 用法（把 WEIGHTS 换成 Stage1 产出的 model_final.pth）：
#   python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_stage2_pointhead.yaml \
#     MODEL.WEIGHTS output_v2/wheat_stage1_detector_v2_cosine/model_final.pth \
#     OUTPUT_DIR output_v2/wheat_stage2_pointhead
# ============================================================================
_BASE_: maskdino_R50_bs16_50ep_3s_dowsample1_2048.yaml

DATASETS:
  TRAIN: ("wheat_cat2_pts_coco_train",)
  TEST: ("wheat_cat2_pts_coco_val",)

MODEL:
  # 用 Stage1 训好的检测器权重热启动（点头此时是初始化值，将在本阶段训练）。
  WEIGHTS: "output_v2/wheat_stage1_detector_v2_cosine/model_final.pth"
  MaskDINO:
    FREEZE_EXCEPT_POINT_HEAD: True
    # 启用点损失
    POINT_COORD_WEIGHT: 5.0
    POINT_CLASS_WEIGHT: 2.0
    # 内层点匹配代价（把 P 个预测点匹配到该穗的 GT 小穗）。
    # 注意不能置 0：cost 全零会让 linear_sum_assignment 退化成恒等分配，
    # 即第 k 个预测点槽被硬指派给标注顺序的第 k 个 GT 小穗、与距离无关，
    # 坐标头因此塌陷到穗中轴线（见 experiments-bank/experiments/exp-2026-08-20-stage2-baseline.md）。
    # 这两项只作用于内层；外层 query→实例的匹配走 matcher.py，本就不含点项。
    COST_POINT_COORD_WEIGHT: 5.0
    COST_POINT_CLASS_WEIGHT: 2.0
    TEST:
      # 加挂小穗点评估器：点级 P/R/F1（σ 为原图像素）+ 每穗/整图计数误差。
      SPIKELET_EVAL: True

INPUT:
  # val 图原生就是 1024x1024，设成 1024 即完全不缩放，与训练尺度一致。
  # detectron2 默认的 800/1333 会把图压到 800x800，小穗这种小目标先损失一档分辨率。
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TEST: 1024

SOLVER:
  # 320 张 / IMS_PER_BATCH 4 = 80 iter/epoch。只训两个 MLP，收敛快；以下按 ~100 epoch 估算。
  IMS_PER_BATCH: 4
  MAX_ITER: 8000
  STEPS: (6400, 7400)
  WARMUP_ITERS: 500
  CHECKPOINT_PERIOD: 800
  BASE_LR: 0.0001
  # 冻结 trunk 后 BACKBONE_MULTIPLIER 实际不生效（backbone 无可训练参数），保留无害。
  BACKBONE_MULTIPLIER: 0.1

TEST:
  # 注意：COCOEvaluator 只评 mask/box AP（trunk 冻结，应与 Stage1 持平），不评小穗点。
  # 点的精度需用专门脚本（如 myscripts 下的 seg_infer_reg 那套）单独评估。
  EVAL_PERIOD: 800
