# ============================================================================
# 两阶段迁移 · Stage2：在 Stage1 检测器上训练小穗点头
#
#   数据：coco_2cat_with_points（train 320 图 / val 81 图 / 257 穗 / 3592 点，
#         点只标在 wheat_2 上）。DATASETS.TEST 就是 val，训练期评估即泛化曲线。
#   解冻：arm B —— 整个 sem_seg_head（pixel_decoder + predictor 全部子模块），
#         backbone 保持冻结。
#   匹配：外层 query->实例走 matcher.py，内层点槽->GT 小穗走 criterion.py，两层独立。
#   评估：COCOEvaluator（mask/box AP）+ SpikeletPointEvaluator（点 P/R/F1 + 计数）。
#
# 用法：
#   CUDA_VISIBLE_DEVICES=<g> PYTHONPATH=. python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_stage2_pointhead.yaml \
#     MODEL.WEIGHTS <绝对路径>/output_v2/wheat_stage1_detector_v2_cosine/model_final.pth \
#     OUTPUT_DIR <绝对路径>/output_v2/<run 名>
#   （在 worktree 里跑时 MODEL.WEIGHTS 必须给绝对路径：配置链里是相对路径，
#     按 worktree 的 cwd 解析不到。）
#
# ---------------------------------------------------------------------------
# 【本文件取代了原来的四个 Stage2 配置】2026-09-02 合并
#
#   wheat_stage2_pointhead.yaml                    冻结 trunk 的 Stage2 原设计
#   wheat_stage2_unfreeze.yaml                     arm B 解冻
#   wheat_stage2_pointhead_overfit10.yaml          10 图过拟合调试集
#   wheat_stage2_unfreeze_allheads_overfit10.yaml  arm C on overfit10
#
# ############################################################################
# 【严重警告 · 文件名沿用但语义已变】
#
# 本文件沿用了 wheat_stage2_pointhead.yaml 这个名字，但它【不是】原来那份。
# 原文件的默认值是「冻结 trunk + 检测权重全零 + P=50 + 单层 Linear 存在性头」；
# 本文件的默认值是「arm B 解冻 + 七项权重全非零 + P=25 + MLP + α0.5 + w0.1 + LSJ 修复」。
#
# 2026-09-02 之前的 experiments-bank 文档（innercost / pointloss-only /
# slot-specialization / focal-alpha / class-mlp / num-points / empty-cls-weight /
# unfreeze 各篇）凡是提到「wheat_stage2_pointhead.yaml」的，指的都是【原文件】。
# 想复现那些实验，用下面的配方 ③（冻结 trunk），不要直接跑本文件的默认值。
#
# 更可靠的做法：每个 run 的 OUTPUT_DIR 下都有 detectron2 落盘的完整 config.yaml，
# 【历史实验的复现一律以那份为准】，与本文件无关。
# ############################################################################
#
# 历史变体的 CLI 复现配方（追加在命令末尾）。下面的 ① 是公共前缀，已逐项与被删掉的
# 原文件对拍验证过（展开 317 项全同）：
#
#   ① 撤销本文件相对旧 wheat_stage2_unfreeze.yaml 新增的五个旋钮：
#     MODEL.MaskDINO.NUM_POINTS 50 \
#     MODEL.MaskDINO.POINT_CLASS_MLP False \
#     MODEL.MaskDINO.POINT_FOCAL_ALPHA 0.25 \
#     MODEL.MaskDINO.POINT_EMPTY_CLS_WEIGHT 1.0 \
#     INPUT.DEMOTE_BORDER_TRUNCATED False
#
#   ② 纯 arm B —— 即 ① 本身，无需再加任何东西。
#     这就是 output_v2/exp-0827-real-unfzB 的配置，【是本文件默认值的唯一对照】：
#     报效果时只报「默认 vs ②」这一个差值，不要与 overfit10 时代的数字横向比较。
#
#   ③ 冻结 trunk 的原始 Stage2（total_loss 只含点损失，可直接当收敛曲线读）= ① 再加：
#     MODEL.MaskDINO.UNFREEZE_KEYS "[]" \
#     MODEL.MaskDINO.CLASS_WEIGHT 0.0 MODEL.MaskDINO.MASK_WEIGHT 0.0 \
#     MODEL.MaskDINO.DICE_WEIGHT 0.0 MODEL.MaskDINO.BOX_WEIGHT 0.0 \
#     MODEL.MaskDINO.GIOU_WEIGHT 0.0 \
#     SOLVER.CHECKPOINT_PERIOD 800 TEST.EVAL_PERIOD 800
#
#   ④ 其他解冻 arm = ① 再加 UNFREEZE_KEYS（括号内为该 arm 在 P=50+Linear 下的可训练参数，
#     训练日志会打印，对不上说明子串匹配越界，立即停）：
#     arm A  MODEL.MaskDINO.UNFREEZE_KEYS "['predictor.decoder']"          14,413,082
#     arm C  ... "['predictor.decoder','predictor.class_embed','predictor.mask_embed']"
#                                                                          14,610,972
#     arm B  ... "['sem_seg_head']"（= ②）                                  28,733,212
#     arm D  ... "['backbone','sem_seg_head']"                             52,188,124
#     注意 arm A/C 的 "predictor.decoder" 因 maskdino_decoder.py:168 的别名赋值
#       self.decoder.bbox_embed = self.bbox_embed
#     会连框头一并解冻（named_parameters 去重后幸存名为 predictor.decoder.bbox_embed.*）。
#     本文件的默认值（arm B + P=25 + MLP 存在性头）对应 28,845,521。
#
#   ⑤ overfit10 调试集（TRAIN == TEST，只用于可行性闸门，不可汇报泛化）= ③ 再加：
#     DATASETS.TRAIN "('wheat_cat2_pts_coco_overfit10',)" \
#     DATASETS.TEST  "('wheat_cat2_pts_coco_overfit10',)" \
#     INPUT.MIN_SCALE 1.0 INPUT.MAX_SCALE 1.0 INPUT.RANDOM_FLIP none \
#     SOLVER.IMS_PER_BATCH 2 SOLVER.MAX_ITER 2000 SOLVER.STEPS "(1600,1900)" \
#     SOLVER.WARMUP_ITERS 100 SOLVER.CHECKPOINT_PERIOD 200 TEST.EVAL_PERIOD 100
#     ——该闸门能筛掉"根本拟合不了"的方案，但【不能用来给能拟合的方案排序】：
#     解冻组的 arm 排序在 10 图与 320 图上完全相反（exp-2026-08-27-unfreeze-real-dataset）。
# ============================================================================
_BASE_: maskdino_R50_bs16_50ep_3s_dowsample1_2048.yaml

DATASETS:
  TRAIN: ("wheat_cat2_pts_coco_train",)
  TEST: ("wheat_cat2_pts_coco_val",)

MODEL:
  # 用 Stage1 训好的检测器权重热启动。点头在 Stage1 里不存在（或形状不同），
  # 会报 shape mismatch warning 并重新初始化，属正常。
  WEIGHTS: "output_v2/wheat_stage1_detector_v2_cosine/model_final.pth"

  MaskDINO:
    # ================== 一、冻结范围 ==================
    # FREEZE_EXCEPT_POINT_HEAD=True：点头恒可训练；UNFREEZE_KEYS 是额外解冻的参数名子串。
    FREEZE_EXCEPT_POINT_HEAD: True
    # 默认 arm B。拐点落在 sem_seg_head 与 backbone 之间是有实际意义的：
    # 前者是任务相关部分（编码器 + 解码器 + 各预测头），后者是通用视觉特征——
    # 320 图足以重训前者、不足以重训后者。四个 arm 的判决（八档阈值各取最优）：
    #
    #   arm | 可训练参数 | matched_F1@8 | 计数 MAE | segm AP
    #   ----|-----------|--------------|----------|--------
    #    A  | 14,413,082|    0.5428    |   2.75   |  72.69
    #    C  | 14,610,972|    0.5534    |   2.69   |  72.54
    #    B  | 28,733,212|    0.5806    |   2.48   |  67.85   <- 最优点
    #    D  | 52,188,124|    0.5520    |   2.46   |  65.10
    #
    # matched_F1@8 在 B 处拐头（A < C < B > D），解冻范围存在最优值而非越多越好。
    # B 掉的 5.5 点 segm AP 是掩码精度不是实例检出（spike_precision 与 A 只差 1.2 个
    # 百分点）。【若掩码本身是交付物，改用 arm A】：点指标只低 7%，掩码几乎无损。
    # 详见 experiments-bank/experiments/exp-2026-08-28-unfreeze-full-model.md
    UNFREEZE_KEYS: ["sem_seg_head"]

    # ================== 二、点头结构 ==================
    # 每实例点槽数 P。全库实测单穗小穗数 train min=1/max=24/mean=13.9/p95=18，
    # val min=7/max=22，所以 P=25 刚好覆盖、无需留余量。
    # 点损失的形状与归一化都依赖它：存在性 focal 对全部 P 个槽算，坐标 L1 只对匹配上的
    # Ni 个算，两者都除以 num_pos。P 从 50 降到 25 使边际频率从 0.28 升到 0.56，
    # 会整体抬高置信度、右移工作点。
    # 别与 base 里的 TRAIN_NUM_POINTS=12544 混淆——那是 mask 损失的点采样数。
    NUM_POINTS: 25
    # 存在性头 point_class_embed：单层 nn.Linear -> 3 层 MLP（与坐标头同构）。
    # 【会改参数名】point_class_embed.weight/bias <-> .layers.{0,1,2}.*，
    # 与 NUM_POINTS 一起使得两种设置训出的 Stage2 checkpoint 无法互相加载。
    POINT_CLASS_MLP: True

    # ================== 三、点损失 ==================
    POINT_COORD_WEIGHT: 5.0
    POINT_CLASS_WEIGHT: 2.0
    # 点存在性 focal 的 alpha，与 loss_labels 的 self.focal_alpha(=0.25) 解耦。
    # 检测头是 300 query 配约 39 个正样本，点头是 P 个槽配约 14 个，正负比温和得多。
    # 三档实测：0.25 -> AUC 0.6714 / 计数 7.61；0.50 -> 0.7191 / 6.02；0.75 -> 0.7136 / 6.57。
    # AUC 在 0.72 附近饱和 —— 它是【标定旋钮不是判别力手段】：把置信度整体右移，
    # 最优阈值也跟着右移（0.35 -> 0.40 -> 0.50）。
    POINT_FOCAL_ALPHA: 0.5
    # Ni==0（无小穗的 wheat）实例的存在性损失权重，只乘在 cls_loss 分子上，不影响 num_pos。
    # w=0.0 计数更好（val MAE 4.14 vs 5.49）但有明确失败模式：无点实例完全无梯度，
    # 产生 8020 个超阈值槽（基线的 86 倍），目前只靠 instance_inference 的类别门控挡着。
    # 0.1 取了计数收益又保留抑制。注意跨实例 AUC 只在 wheat_2 上算，【看不见这个失败模式】。
    POINT_EMPTY_CLS_WEIGHT: 0.1

    # ================== 四、检测损失（解冻后必须非零）==================
    # 冻结 trunk 时这五项曾被置 0，依据是「梯度对唯一可训练的点头恒为 0」。
    # 一旦解冻该前提失效：decoder 变成只为点损失优化，没有任何东西惩罚它破坏检测
    # （08-26 实测代价是 segm AP 73.3 -> 0.00、spike_recall 归零）。故必须保持 Stage1 原值。
    #
    #   头（模块）                      损失项              权重
    #   ---------------------------------------------------------------
    #   predictor.class_embed           loss_ce             4.0
    #   predictor.mask_embed            loss_mask           5.0
    #   predictor.mask_embed            loss_dice           5.0
    #   predictor.decoder.bbox_embed    loss_bbox           5.0
    #   predictor.decoder.bbox_embed    loss_giou           2.0
    CLASS_WEIGHT: 4.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0

    # ================== 五、匹配代价（与损失权重完全独立）==================
    # 加权只发生在一处：maskdino.py:286 `losses[k] *= weight_dict[k]`（key 不在
    # weight_dict 里则直接 pop 丢弃），所以 metrics.json 里的 loss_* 已是加权后的值。
    #
    # 【外层】query -> GT 实例的匈牙利分配，matcher.py:195 C = Σ COST_i * cost_i，
    # @torch.no_grad 不参与反传。这五项在整条 _BASE_ 链里从未出现过，一直吃
    # maskdino/config.py:48-52 的默认值，数值恰好与 Stage1 的损失权重相同（4/5/5/5/2），
    # 【极易误以为是同一个旋钮】—— 两者独立，改上面的 CLASS_WEIGHT 不会动到这里。
    # matcher.py:104 还有硬保护：cls/mask/dice 三项不能同时为 0。
    COST_CLASS_WEIGHT: 4.0
    COST_MASK_WEIGHT: 5.0
    COST_DICE_WEIGHT: 5.0
    COST_BOX_WEIGHT: 5.0
    COST_GIOU_WEIGHT: 2.0
    # 【内层】P 个预测点槽 -> 该穗的 Ni 个 GT 小穗，criterion.py:344。
    # 【不可置 0】：cost 全零会让 linear_sum_assignment 退化成恒等分配，即第 k 个点槽
    # 被硬指派给标注顺序的第 k 个 GT 小穗、与距离无关，坐标头因此塌陷到穗中轴线
    # （见 experiments-bank/experiments/exp-2026-08-20-stage2-baseline.md）。
    COST_POINT_COORD_WEIGHT: 5.0
    COST_POINT_CLASS_WEIGHT: 2.0

    # ---- 【死参数】NO_OBJECT_WEIGHT 只经 eos_coef -> empty_weight 进 loss_labels_ce，
    # 而实例分割走的是 focal 的 loss_labels（criterion.py:200），背景抑制由写死的
    # focal_alpha=0.25 负责，本仓库这条路径上不生效。写出来只为避免下次再查。
    NO_OBJECT_WEIGHT: 0.1

    # ================== 六、小穗点的推理与评估 ==================
    # 【这五项分属两个环节，不要混为一谈】
    #   POINT_THRESHOLD    -> maskdino.py:230，进【模型推理】，决定模型输出哪些点
    #   SPIKELET_EVAL_*    -> train_net.py:200-207，进【评估器】，决定怎么配对与打分
    # 所以改 POINT_THRESHOLD 必须重跑推理（八档阈值扫描就是重跑八次评估，
    # 不是对同一批输出做后过滤）；改 SPIKELET_EVAL_* 只影响配对，输出不变。
    TEST:
      # ---- 【推理侧】小穗点存在性阈值：maskdino.py:545 `keep_pt = score_k > point_threshold`
      # 只对 pred_classes == spikelet_class_id 的实例生效；wheat 实例恒输出 0 个点
      # （maskdino.py:113 把 spikelet_class_id 写死为 1，不是配置项）。
      # 【它同时决定计数】——输出几个点就是预测几个小穗，所以这是计数任务的主旋钮。
      POINT_THRESHOLD: 0.35

      # ---- 【评估侧】是否加挂 SpikeletPointEvaluator：
      # 点级 P/R/F1（σ 为原图像素）+ 每穗/整图计数误差 + 假阳产出量。
      # COCOEvaluator 只评 mask/box AP，不评这些。
      SPIKELET_EVAL: True

      # ---- 【评估侧】点匹配的距离阈值（原图像素，多档一起报，指标名 F1@3/@5/@8）。
      # GT 实测同穗内小穗最近邻间距中位 16px，故 8px 已是不产生歧义匹配的上限。
      SPIKELET_EVAL_SIGMAS: [3.0, 5.0, 8.0]

      # ---- 【评估侧】实例分数门槛：只有分数不低于该值的 wheat_2 预测实例才参与点评估。
      # 0.4 是 Stage1 检测器在带点 val 上实例配对 F1 的峰值（recall 0.76 / precision 0.76）；
      # 取 0.5 会让 recall 掉到 0.53，相当于先丢掉一半 GT 穗，点级 recall 也就被封顶了。
      # 【必须显式写出】SpikeletPointEvaluator.__init__ 自己的默认值是 0.5，
      # 一旦这里漏写就会静默换成另一个口径。
      SPIKELET_EVAL_SCORE_THRESH: 0.4

      # ---- 【评估侧】GT 穗与预测穗配对所需的最小 mask IoU（匈牙利匹配后的接受门槛）。
      SPIKELET_EVAL_IOU_THRESH: 0.5

      # ======================= 读这些指标时的两条口径 =======================
      # ① count_MAE_spike 与 matched_F1@σ 【只在配对上的穗内部计算】。
      #    被误判为 wheat_2 的实例照常输出小穗点，却完全不进这两个指标 ——
      #    评估器的 fp_spike_count / fp_point_count / fp_point_ratio 就是为此补的。
      #    纯 arm B 在 val 81 图上实测，这部分点占全部预测点的 24%~34%
      #    （随解冻范围上升）。要看含全部预测的口径，用 seg_infer_reg 的逐图 MAE。
      #
      # ② 两个阈值对两个口径的作用方向不同，纯 arm B 在 val 上的八组实测：
      #    score / point   预测穗  逐图MAE  逐穗MAE  TP穗  假阳穗  mF1@8
      #     0.30 / 0.20     336     38.54    6.16    212   120    0.5762
      #     0.30 / 0.35     336     15.09    3.01    212   120    0.4814
      #     0.40 / 0.20     280     27.74    6.36    198    77    0.5806  <- 定位最优
      #     0.40 / 0.35     280     14.15    2.48    198    77    0.4933  <- 计数最优
      #    放宽 score 0.40->0.30 多配上 14 个真穗，却多冒 43 个假阳穗，两个 MAE 都变差。
      #    point 0.35->0.20 把 mF1@8 抬 0.087，代价是逐穗 MAE 恶化 2.56 倍。
      #    【定位与计数无法同时最优】，报指标时必须写明用的哪一档。
      #
      # ③ 上表来自 P=50 + Linear 存在性头 + α0.25 的纯 arm B。本文件默认改了四个
      #    标定旋钮（P=25 / MLP / α0.5 / w0.1），它们对置信度分布的推动方向不一致
      #    （α=0.5 把最优阈值推到 0.40，而 P=25 推到 0.20），叠加后的工作点无法预测。
      #    【必须重扫】，且现有八档 {0.10,0.15,0.20,0.28,0.35,0.40,0.50,0.60}
      #    可能已框不住最优点，两头加档。
      # ====================================================================

INPUT:
  # val 图原生就是 1024x1024，设成 1024 即完全不缩放，与训练尺度一致。
  # detectron2 默认的 800/1333 会把图压到 800x800，小穗这种小目标先损失一档分辨率。
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TEST: 1024
  # ---- LSJ 增强造成的 wheat_2 标签噪声修复（只作用于训练，mapper 对 is_train=False 提前返回）
  # ResizeScale(0.1~2.0)+FixedSizeCrop(1024) 在 scale>1 时会把完整的 wheat_2 切到 crop
  # 边界，但标签仍是 wheat_2，与标注规则「截断的穗子归 wheat」矛盾。
  # 开启后把贴边实例降级为 wheat 并【清空其 gt_points】。
  #
  # 实测（train 前 100 图，固定种子，开关对比）：
  #   实例总数 3071 不变；wheat_2 220 -> 165（降级 55 个，25.0%）；
  #   wheat_2 上的点 2510 -> 2104（清空 406 个，16.2%）；
  #   残留「类别=wheat 却带点」的实例 0 个。
  # 被降级的穗平均只带 7.4 个点，而整体均值 11.4 —— mapper 本就会滤掉图外的点，
  # 所以截断穗是在用「可见部分的点数」冒充完整穗的计数标签，这是预测向均值收缩
  # （散点拟合斜率 0.42~0.48、r <= 0.46）的一条具体机制。
  # 清空后该实例 Ni=0，自然走 POINT_EMPTY_CLS_WEIGHT 的降权路径，
  # 与推理端 instance_inference 按 pred_classes 门控的行为一致。
  DEMOTE_BORDER_TRUNCATED: True

SOLVER:
  # 320 图 / IMS_PER_BATCH 4 = 80 iter/epoch，8000 iter ≈ 100 epoch。
  # 解冻 28.7M 参数后 100 epoch 可能过拟合，但训练期评估就是 val，直接读曲线取峰值即可，
  # 不必先猜 schedule。四个 arm 的 val 峰值都在 iter 7199、末次仅略低、无明显回落。
  IMS_PER_BATCH: 4
  MAX_ITER: 8000
  STEPS: (6400, 7400)
  WARMUP_ITERS: 500
  BASE_LR: 0.0001
  # checkpoint 与评估同频，保证峰值那一档一定有权重可取。
  CHECKPOINT_PERIOD: 400
  # 只在 arm D（解冻 backbone）时才真正生效；A/C/B 的 backbone 全程冻结，此项是死参数。
  BACKBONE_MULTIPLIER: 0.1

TEST:
  # COCOEvaluator 只评 mask/box AP，不评小穗点；点指标走上面的 SPIKELET_EVAL。
  EVAL_PERIOD: 400
