# ============================================================================
# 两阶段迁移 · Stage2：只训练小穗点头（point_coord_embed / point_class_embed）
#   数据：coco_2cat_with_points（带点小数据集，train=320 / val=81 图，点集中在 wheat_2）
#   冻结：backbone + pixel decoder + transformer decoder + cls/mask/box 头全部 requires_grad=False，
#         只有点头进优化器。（模型里没有 BN/dropout 需要额外固定：backbone 是 FrozenBN、
#         pixel decoder 是 GN、DROPOUT=0.0。）
#   匹配：点匹配代价置 0，使外层匈牙利匹配与 Stage1 完全相同（只有点损失反传到点头）。
#   评估：除 COCOEvaluator 的 mask/box AP 外，加挂 SpikeletPointEvaluator 评小穗点定位与计数。
# 用法（把 WEIGHTS 换成 Stage1 产出的 model_final.pth）：
#   python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_stage2_pointhead.yaml \
#     MODEL.WEIGHTS output_v2/wheat_stage1_detector_v2_cosine/model_final.pth \
#     OUTPUT_DIR output_v2/wheat_stage2_pointhead
# ============================================================================
_BASE_: maskdino_R50_bs16_50ep_3s_dowsample1_2048.yaml

DATASETS:
  TRAIN: ("wheat_cat2_pts_coco_train",)
  TEST: ("wheat_cat2_pts_coco_val",)

MODEL:
  # 用 Stage1 训好的检测器权重热启动（点头此时是初始化值，将在本阶段训练）。
  WEIGHTS: "output_v2/wheat_stage1_detector_v2_cosine/model_final.pth"
  MaskDINO:
    FREEZE_EXCEPT_POINT_HEAD: True

    # ======================= 权重全景（Stage2）=======================
    # 下面把继承来的默认值也【显式写全】，数值与继承值逐项相同，只是把"隐式默认"
    # 变成"显式声明"，不改变任何行为；改实验时一眼能看到全部旋钮。
    #
    # 三组权重、两层匹配，互相完全解耦：
    #   1) 外层匹配代价 COST_*        matcher.py:195  C = Σ COST_i * cost_i   （query -> GT 实例）
    #   2) 内层点匹配代价 COST_POINT_* criterion.py:344 C = Σ COST_POINT_i * cost_i（点槽 -> GT 小穗）
    #   3) 损失权重 *_WEIGHT          maskdino.py:153 组装 weight_dict
    # 加权只发生在一处：maskdino.py:286 `losses[k] *= weight_dict[k]`
    #   （key 不在 weight_dict 里则直接 pop 丢弃）；
    #   total_loss = 加权后所有项之和，即 metrics.json 里记的 loss_* 已是【加权后】的值。
    # 本阶段检测损失全为 0，127 项里只有 22 项点损失非零（末层 + 9 个 aux + interm，各 2 项），
    #   所以 total_loss 可以直接当点损失的收敛曲线读。
    # ================================================================

    # ---- 【损失权重 · 点】本阶段唯一有梯度的两项
    POINT_COORD_WEIGHT: 5.0
    POINT_CLASS_WEIGHT: 2.0
    # ---- 【损失权重 · 检测】全部置 0，使 total_loss 只由点损失构成、可直接当收敛曲线读。
    # trunk 已全部冻结，这些损失对点头的梯度本来就恒为 0，置 0 不改变任何参数更新；
    # 但它们仍会被计算（criterion 无条件遍历 losses 列表），所以并不省算力。
    # 原值（Stage1 用的）为 CLASS 4.0 / MASK 5.0 / DICE 5.0 / BOX 5.0 / GIOU 2.0。
    CLASS_WEIGHT: 0.0
    MASK_WEIGHT: 0.0
    DICE_WEIGHT: 0.0
    BOX_WEIGHT: 0.0
    GIOU_WEIGHT: 0.0

    # ---- 【外层匹配代价】query -> GT 实例的匈牙利分配（不参与反传，@torch.no_grad）
    # 只动损失权重，COST_* 一律保持与 Stage1 相同的原值 —— 外层匈牙利匹配仍要靠
    # cls/mask/dice/box/giou 把 query 正确分配给 GT 实例，点损失完全建立在这个分配之上。
    # 这五项在整条 _BASE_ 链里从未出现过，一直吃 maskdino/config.py:48-52 的默认值，
    # 数值恰好与 Stage1 的损失权重相同（4/5/5/5/2），极易误以为是同一个旋钮 —— 两者独立，
    # 上面把 CLASS_WEIGHT 等置 0 不会动到这里。matcher.py:104 还有硬保护：
    # cls/mask/dice 三项不能同时为 0。
    COST_CLASS_WEIGHT: 4.0
    COST_MASK_WEIGHT: 5.0
    COST_DICE_WEIGHT: 5.0
    COST_BOX_WEIGHT: 5.0
    COST_GIOU_WEIGHT: 2.0
    # ---- 【内层点匹配代价】把 P 个预测点匹配到该穗的 GT 小穗。
    # 注意不能置 0：cost 全零会让 linear_sum_assignment 退化成恒等分配，
    # 即第 k 个预测点槽被硬指派给标注顺序的第 k 个 GT 小穗、与距离无关，
    # 坐标头因此塌陷到穗中轴线（见 experiments-bank/experiments/exp-2026-08-20-stage2-baseline.md）。
    # 这两项只作用于内层；外层 query->实例的匹配走 matcher.py，本就不含点项。
    COST_POINT_COORD_WEIGHT: 5.0
    COST_POINT_CLASS_WEIGHT: 2.0

    # ---- 【死参数】NO_OBJECT_WEIGHT 只经 eos_coef -> empty_weight 进 loss_labels_ce，
    # 而实例分割走的是 focal 的 loss_labels（criterion.py:200），背景抑制由写死的
    # focal_alpha=0.25 负责，所以此值在本仓库这条路径上不生效。写出来只为避免下次再查。
    NO_OBJECT_WEIGHT: 0.1

    # ---- 每实例预测点槽数 P（点头输出维度）。不是权重，但点损失的形状与归一化都依赖它：
    # 存在性 focal 对全部 P 个点算，坐标 L1 只对匹配上的 Ni 个点算，两者都除以 num_pos。
    # 别与 base 里的 TRAIN_NUM_POINTS=12544 混淆 —— 那是 mask 损失的点采样数。
    NUM_POINTS: 50

    TEST:
      # 加挂小穗点评估器：点级 P/R/F1（σ 为原图像素）+ 每穗/整图计数误差。
      SPIKELET_EVAL: True

INPUT:
  # val 图原生就是 1024x1024，设成 1024 即完全不缩放，与训练尺度一致。
  # detectron2 默认的 800/1333 会把图压到 800x800，小穗这种小目标先损失一档分辨率。
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TEST: 1024

SOLVER:
  # 320 张 / IMS_PER_BATCH 4 = 80 iter/epoch。只训两个 MLP，收敛快；以下按 ~100 epoch 估算。
  IMS_PER_BATCH: 4
  MAX_ITER: 8000
  STEPS: (6400, 7400)
  WARMUP_ITERS: 500
  CHECKPOINT_PERIOD: 800
  BASE_LR: 0.0001
  # 冻结 trunk 后 BACKBONE_MULTIPLIER 实际不生效（backbone 无可训练参数），保留无害。
  BACKBONE_MULTIPLIER: 0.1

TEST:
  # 注意：COCOEvaluator 只评 mask/box AP（trunk 冻结，应与 Stage1 持平），不评小穗点。
  # 点的精度需用专门脚本（如 myscripts 下的 seg_infer_reg 那套）单独评估。
  EVAL_PERIOD: 800
