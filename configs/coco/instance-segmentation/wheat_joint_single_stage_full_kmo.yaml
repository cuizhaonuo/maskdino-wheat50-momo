# ============================================================================
# 完整集 · full/kmo-matcher · KMO 内层点匹配（单点消融）
#   预注册：experiments-bank/ideas/full-kmo-matcher.md（判否线在跑之前写死）
#   主参照：output_v2/exp-0922-single-stage-p30（26000 iter、300 query、P=30，segm 81.97 / MAE 2.77）
#   mini 对应臂：mini/kmo-matcher（MAE 2.450，与基线噪声内；机制门过：knn 代价确实改变配对）
#
# 与 wheat_joint_single_stage.yaml 的差异【只有 POINT_KMO 一处】：内层匹配代价从
#     C = 5·|p - p̂|₁ + 2·focal(ĉ)
# 换成（CLTR, ECCV 2022 §3.3 Eq.3，KMO-based Hungarian）：
#     C = 5·|p - p̂|₁ + 5·|y^k - ŷ^k| + 2·focal(ĉ)
# y^k 是 GT 小穗到其 K 个最近邻的平均距离（框相对 [0,1] 空间），ŷ^k 由 point_knn_embed 头
# 逐槽预测，匹配上的槽用 L1 监督（loss_point_knn）。其余旋钮一律继承不动。
#
# 用法：
#   python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_joint_single_stage_full_kmo.yaml \
#     OUTPUT_DIR /public/home/zncui/pycharm_project/maskdino-wheat50/output_v2/<run-name>
# ============================================================================
_BASE_: wheat_joint_single_stage.yaml

MODEL:
  MaskDINO:
    POINT_KMO: True
    # 以下三项与 config.py 默认值相同，显式写出以便对照官方实现：
    POINT_KMO_K: 3
    COST_POINT_KNN_WEIGHT: 5.0
    POINT_KNN_WEIGHT: 5.0
