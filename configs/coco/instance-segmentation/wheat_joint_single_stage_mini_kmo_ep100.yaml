# ============================================================================
# 单阶段联合训练 · 500 图小集 · KMO 内层点匹配 · 100 epoch 版（mini/kmo-matcher-ep100）
#   预注册：experiments-bank/ideas/kmo-matcher-ep100.md（判否线已在跑之前写死）
#   对照：mini/ep100（output_v2/exp-0923-mini-ep100，100 epoch、不开 KMO）
#
# 与 wheat_joint_single_stage_mini_kmo.yaml（KMO 50 epoch）的差异【只有 schedule】，
# 数值逐项取自 mini/ep100 分支的 wheat_joint_single_stage_mini_ep100.yaml：
#   MAX_ITER 6250 -> 12500、STEPS 按比例缩放、CHECKPOINT/EVAL_PERIOD 250 -> 500，
#   WARMUP_ITERS 保持 250（ep100 配置的理由：前 250 iter 与 50 epoch 版逐步相同，差异从 warmup 后才出现）。
# 因此与 mini/ep100 的差异【只有 POINT_KMO 一处】（启动前已用解析后的 cfg 逐项核对）。
#
# 为什么复跑：mini/ep100 证明 50 epoch 对 mini 是被 cosine 掐断的，mini/* 的默认 schedule
# 已改为 100 epoch。KMO 在 50 epoch 下的 matched_F1@8 +0.024 是在训练不充分的基线上测的，
# 需要在 100 epoch 下确认它不只是「收敛更快」。
#
# 用法：
#   python train_net.py --num-gpus 1 \
#     --config-file configs/coco/instance-segmentation/wheat_joint_single_stage_mini_kmo_ep100.yaml \
#     OUTPUT_DIR output_v2/<run-name>
# ============================================================================
_BASE_: wheat_joint_single_stage_mini_kmo.yaml

SOLVER:
  # 500 图 / IMS_PER_BATCH 4 = 125 iter/epoch，12500 iter = 100 epoch。
  MAX_ITER: 12500
  # 与 ep100 一致，故意不随 MAX_ITER 缩放。
  WARMUP_ITERS: 250
  # cosine 下不生效，按比例缩放后保留，以便切回 step 调度。
  STEPS: (10000, 11500)
  # 4 epoch 一存 / 一评，保持 25 个采样点，与 ep100 的曲线分辨率一致。
  CHECKPOINT_PERIOD: 500

TEST:
  EVAL_PERIOD: 500
