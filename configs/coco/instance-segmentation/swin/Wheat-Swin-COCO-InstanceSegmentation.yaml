MODEL:
  BACKBONE:
    FREEZE_AT: 0
    NAME: "build_resnet_backbone"
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  RESNETS:
    DEPTH: 50
    STEM_TYPE: "basic"  # not used
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    # NORM: "SyncBN"。
    RES5_MULTI_GRID: [1, 1, 1]  # not used

DATASETS:
  TRAIN: ("wheat_coco_train",)
  TEST: ("wheat_coco_val",)

SOLVER:
#  IMS_PER_BATCH: 6
#  BASE_LR: 0.0001
#  MAX_ITER: 6667
#  STEPS: (6000, 6400)
#  WARMUP_ITERS: 128        # 可以稍微拉长 warmup
#  WEIGHT_DECAY: 0.05
#  IMS_PER_BATCH: 2
#  BASE_LR: 0.0001
#  MAX_ITER: 40000
#  STEPS: (32000, 36000)
#  WARMUP_ITERS: 800
