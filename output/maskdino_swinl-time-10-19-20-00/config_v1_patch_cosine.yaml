_BASE_: ./config_v1.yaml
SOLVER:
  LR_SCHEDULER_NAME: WarmupCosineLR
  IMG_PER_BATCH: 3
  MAX_ITER: 2000
  WARMUP_ITERS: 50
  BASE_LR: 0.00001
  BASE_LR_END: 0.0
  STEPS: []
  CHECKPOINT_PERIOD: 200
OUTPUT_DIR: output/maskdino_swinl-time-10-19-20-00-v1-patch-cosine

MODEL:
  MaskDINO:
    LEARN_TGT: true
    DN: 'no'
    NUM_OBJECT_QUERIES: 300
    # COST
    COST_BOX_WEIGHT: 5.0
    COST_CLASS_WEIGHT: 1.0
    COST_DICE_WEIGHT: 5.0
    COST_GIOU_WEIGHT: 2.0
    COST_MASK_WEIGHT: 5.0
    # LOSS
    BOX_WEIGHT: 5.0
    CLASS_WEIGHT: 1.0
    DICE_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    MASK_WEIGHT: 5.0